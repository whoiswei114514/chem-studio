<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; object-src 'none'; base-uri 'none'">
  <title>Chem Studio</title>
  <style>
    * { box-sizing:border-box; letter-spacing:0; }
    html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#f7f8fa; }
    canvas { display:block; width:100%; height:100%; outline:0; touch-action:none; }
    #selection { position:absolute; left:16px; bottom:14px; max-width:calc(100% - 32px); color:#3d4751; font:13px "Microsoft YaHei UI",sans-serif; pointer-events:none; }
    #error { position:absolute; inset:24px; font:14px "Microsoft YaHei UI",sans-serif; color:#a33232; white-space:pre-wrap; }
  </style>
</head>
<body><div id="selection" aria-live="polite"></div><div id="error" hidden></div><script src="viewer.js"></script></body>
</html>
