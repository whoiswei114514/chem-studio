    <g stroke-linecap="round" stroke-linejoin="round">
      <!-- Positive brass nub -->
      <rect x="35" y="13" width="20" height="11" rx="3" fill="url(#battery-brass)" stroke="#1F2937" stroke-width="2.0"/>
      <!-- Negative base cap -->
      <rect x="26" y="148" width="38" height="8" rx="2" fill="url(#battery-metal)" stroke="#1F2937" stroke-width="1.8"/>
      <!-- Main cylindrical D-cell casing -->
      <rect x="22" y="24" width="46" height="124" rx="5" fill="url(#battery-chassis)" stroke="#1F2937" stroke-width="2.2"/>
      <!-- Teal positive shoulder band -->
      <path d="M23 28 Q23 25 27 25 H63 Q67 25 67 28 V62 H23 Z" fill="url(#battery-accent)" stroke="none"/>
      <line x1="22" y1="62" x2="68" y2="62" stroke="#1F2937" stroke-width="1.6"/>
      <text x="45" y="48" fill="#FFFFFF" stroke="none" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">+</text>
      <text x="45" y="92" fill="#1F2937" stroke="none" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">1.5 V</text>
      <text x="45" y="108" fill="#64748B" stroke="none" font-family="Segoe UI, Arial, sans-serif" font-size="6.2" font-weight="700" text-anchor="middle">DRY CELL</text>
      <text x="45" y="137" fill="#334155" stroke="none" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">−</text>
      <line x1="28" y1="30" x2="28" y2="142" stroke="#FFFFFF" stroke-width="2.4" stroke-opacity="0.55" stroke-linecap="round"/>
    </g>
  
