    <g stroke-linecap="round" stroke-linejoin="round">
      <circle cx="90" cy="75" r="52" fill="url(#compass-metal)" stroke="#1F2937" stroke-width="2.2"/>
      <circle cx="90" cy="75" r="44" fill="#FFFFFF" stroke="#334155" stroke-width="1.5"/>
      <text x="90" y="41" fill="#DC2626" stroke="none" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="700" text-anchor="middle">N</text>
      <text x="90" y="114" fill="#334155" stroke="none" font-family="Segoe UI, Arial, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">S</text>
      <text x="53" y="78" fill="#64748B" stroke="none" font-family="Segoe UI, Arial, sans-serif" font-size="8" font-weight="700" text-anchor="middle">W</text>
      <text x="127" y="78" fill="#64748B" stroke="none" font-family="Segoe UI, Arial, sans-serif" font-size="8" font-weight="700" text-anchor="middle">E</text>
      <!-- Balanced diamond magnetic needle tilted slightly -->
      <polygon points="90,75 83,68 112,50 96,76" fill="#DC2626" stroke="#1F2937" stroke-width="1.5"/>
      <polygon points="90,75 83,68 68,100 96,76" fill="url(#compass-metal)" stroke="#1F2937" stroke-width="1.5"/>
      <circle cx="90" cy="75" r="4.5" fill="url(#compass-brass)" stroke="#1F2937" stroke-width="1.3"/>
      <path d="M58 50 A38 38 0 0 1 92 38" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-opacity="0.7"/>
