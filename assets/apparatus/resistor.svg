    <g stroke-linecap="round" stroke-linejoin="round">
      <!-- Axial tinned copper leads + terminal rings -->
      <rect x="12" y="72.5" width="38" height="5" fill="url(#resistor-metal-v)" stroke="#1F2937" stroke-width="1.6"/>
      <rect x="130" y="72.5" width="38" height="5" fill="url(#resistor-metal-v)" stroke="#1F2937" stroke-width="1.6"/>
      <circle cx="10" cy="75" r="4" fill="url(#resistor-metal)" stroke="#1F2937" stroke-width="1.6"/>
      <circle cx="170" cy="75" r="4" fill="url(#resistor-metal)" stroke="#1F2937" stroke-width="1.6"/>
      <!-- Precision ceramic axial resistor dog-bone body -->
      <path d="M48 60 Q48 54 56 54 H64 Q68 58 72 58 H108 Q112 58 116 54 H124 Q132 54 132 60 V90 Q132 96 124 96 H116 Q112 92 108 92 H72 Q68 92 64 96 H56 Q48 96 48 90 Z" fill="url(#resistor-porcelain)" stroke="#1F2937" stroke-width="2.2"/>
      <!-- EIA 4-band precision resistor color rings -->
      <rect x="57" y="55" width="7" height="40" fill="#B45309" stroke="none"/>
      <rect x="74" y="59" width="7" height="32" fill="#1E293B" stroke="none"/>
      <rect x="90" y="59" width="7" height="32" fill="#0F766E" stroke="none"/>
