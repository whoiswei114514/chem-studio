    <g stroke-linecap="round" stroke-linejoin="round">
      <!-- Anode/cathode metallic pins -->
      <rect x="70.5" y="90" width="5" height="50" fill="url(#led-metal)" stroke="#1F2937" stroke-width="1.6"/>
      <rect x="104.5" y="90" width="5" height="50" fill="url(#led-metal)" stroke="#1F2937" stroke-width="1.6"/>
      <circle cx="73" cy="141" r="4" fill="#DC2626" stroke="#1F2937" stroke-width="1.4"/>
      <circle cx="107" cy="141" r="4" fill="#1E293B" stroke="#1F2937" stroke-width="1.4"/>
      <!-- Domed translucent epoxy package + internal cup/anvil -->
      <path d="M62 84 V52 A28 28 0 0 1 118 52 V84 Z" fill="url(#led-liquid)" stroke="#1F2937" stroke-width="2.2"/>
      <rect x="57" y="83" width="66" height="9" rx="2" fill="url(#led-accent)" stroke="#1F2937" stroke-width="2.0"/>
      <path d="M74 83 V56 H86 L92 64 V83 M106 83 V56" fill="none" stroke="#334155" stroke-width="1.6"/>
      <path d="M68 48 A22 22 0 0 1 82 31" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-opacity="0.82"/>
      <!-- Radiating light rays -->
      <line x1="126" y1="36" x2="140" y2="26" stroke="#D97706" stroke-width="2.2"/>
      <line x1="130" y1="52" x2="146" y2="48" stroke="#D97706" stroke-width="2.2"/>
      <line x1="54" y1="36" x2="40" y2="26" stroke="#D97706" stroke-width="2.2"/>
      <text x="60" y="126" fill="#DC2626" stroke="none" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="700" text-anchor="middle">+</text>
      <text x="120" y="126" fill="#334155" stroke="none" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="700" text-anchor="middle">−</text>
    </g>
  
