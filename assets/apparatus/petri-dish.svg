      <line x1="34" y1="83" x2="146" y2="83" stroke="#FFFFFF" stroke-width="2.2" stroke-opacity="0.72" stroke-linecap="round"/>
      <line x1="39" y1="98" x2="39" y2="124" stroke="#FFFFFF" stroke-width="2.2" stroke-opacity="0.7" stroke-linecap="round"/>
