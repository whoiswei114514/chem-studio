      <rect x="38" y="38" width="104" height="20" rx="4" fill="url(#pot-cork)" stroke="#1F2937" stroke-width="2.2"/>
      <path d="M52 38 Q90 28 128 38" fill="#9A5E26" stroke="#1F2937" stroke-width="1.6"/>
