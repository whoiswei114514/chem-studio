    <g stroke-linecap="round" stroke-linejoin="round">
      <!-- Incident white ray & dispersed spectral beams -->
      <line x1="12" y1="84" x2="72" y2="84" stroke="#D97706" stroke-width="2.4"/>
      <line x1="72" y1="84" x2="122" y2="78" stroke="#D97706" stroke-width="1.6"/>
      <line x1="122" y1="78" x2="178" y2="62" stroke="#DC2626" stroke-width="2.0"/>
      <line x1="123" y1="81" x2="178" y2="78" stroke="#F59E0B" stroke-width="2.0"/>
      <line x1="125" y1="84" x2="178" y2="94" stroke="#16A34A" stroke-width="2.0"/>
      <line x1="127" y1="87" x2="178" y2="110" stroke="#2563EB" stroke-width="2.0"/>
      <!-- Optical equilateral borosilicate prism -->
      <polygon points="95,24 44,128 146,128" fill="url(#prism-glass)" stroke="#1F2937" stroke-width="2.2"/>
      <line x1="93" y1="34" x2="54" y2="118" stroke="#FFFFFF" stroke-width="2.2" stroke-opacity="0.78" stroke-linecap="round"/>
